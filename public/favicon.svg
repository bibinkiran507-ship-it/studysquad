<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1320" />
      <stop offset="60%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base (1:1 Square Aspect Ratio for Google Search) -->
  <rect x="16" y="16" width="480" height="480" rx="106" fill="url(#bgGrad)" stroke="#10b981" stroke-opacity="0.45" stroke-width="8" />

  <!-- 8-Point Asterisk (StudySquad Starburst Emblem) -->
  <g transform="translate(256, 256)" filter="url(#subtleGlow)">
    <rect x="-19" y="-142" width="38" height="284" rx="19" fill="url(#starGrad)" />
    <rect x="-19" y="-142" width="38" height="284" rx="19" fill="url(#starGrad)" transform="rotate(45)" />
    <rect x="-19" y="-142" width="38" height="284" rx="19" fill="url(#starGrad)" transform="rotate(90)" />
    <rect x="-19" y="-142" width="38" height="284" rx="19" fill="url(#starGrad)" transform="rotate(135)" />
    <!-- Bright Center Hub -->
    <circle cx="0" cy="0" r="44" fill="#d1fae5" />
  </g>
</svg>
